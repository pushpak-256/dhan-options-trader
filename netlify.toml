[build]
  command = "npx expo export --platform web"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/dhan-auth/*"
  to = "/.netlify/functions/dhan-proxy/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/dhan/*"
  to = "/.netlify/functions/dhan-proxy/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
